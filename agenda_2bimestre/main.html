<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Agenda de Prioridades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .degrade-correndo { background: linear-gradient(to right, rgb(248, 243, 173), rgb(233, 221, 113))}; 
    </style>
</head>
<body class="container mt-4 degrade-correndo">
    <h1 class="text-center" style="font-family: Georgia, 'Times New Roman', Times, serif;">Minha Agenda de Tarefas</h1>
    
    <div class="container form-control">
        <div class="row  mb-2 mt-5 mx-2">
            <div class="col-5">
                <label class="visually-hidden" for="inlineFormInputGroupUsername">Digite a tarefa</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="tarefa" placeholder="Tarefas">
                </div>
            </div>

            <div class="col-6">
                <label class="visually-hidden" for="inlineFormSelectPref">Preference</label>
                <select class="form-select" id="prioridade">
                    <option value="baixa">Baixa (Verde)</option>
                    <option value="media">Média (Amarelo)</option>
                    <option value="alta">Alta (Vermelha)</option>
                </select>
            </div>

            <div class="col-1">
                <button onclick="adicionarTarefa()" class="btn btn-primary">Adicionar</button>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-md-4">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">Baixa Prioridade</div>
                    <div class="card-body" id="baixa"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-dark">Média Prioridade</div>
                    <div class="card-body" id="media"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">Alta Prioridade</div>
                    <div class="card-body" id="alta"></div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function adicionarTarefa() {
            var texto = document.getElementById("tarefa").value;
            var prioridade = document.getElementById("prioridade").value;
            if (texto === "") return;

            var novaTarefa = document.createElement("div");
            novaTarefa.className = "alert alert-" + (prioridade === "baixa" ? "success" : prioridade === "media" ? "warning" : "danger") + " mb-2";
            novaTarefa.textContent = texto;

            document.getElementById(prioridade).appendChild(novaTarefa);
            document.getElementById("tarefa").value = ""; 
        }
    </script>
</body>
</html>
