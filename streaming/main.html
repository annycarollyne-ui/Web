<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de filmes</title>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="header">
        <h1>Catálogo de filmes</h1>
    </header>

    <main>
        <div class="container">      
            <div class="row mb-3 mt-3">
                <form class="row g-3" id="formBusca">
                    <div class="col-10">
                        <div class="input-group">
                            <input type="text" class="form-control" id="titulo" placeholder="Digite o nome do filme ou serie">
                        </div>
                    </div>

                    <div class="col-2 d-grid align-items-end mt-3">
                        <button type="submit" class="btn btn-outline-secondary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                    </div>
                </form>            
            </div>


            <div id="resultado" class="row"></div>
        </div>
    </main>

     <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">Catálogo de filmes.</p>
        </div>
    </footer>   

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
